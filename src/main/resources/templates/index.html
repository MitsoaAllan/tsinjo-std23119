<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsinjo - Fonds d'urgence HEI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .donation-list { max-width: 800px; margin: 0 auto; }
        .positive { color: green; }
        .negative { color: red; }
        .verifying { color: orange; }
    </style>
</head>
<body>
<div class="container py-4">
    <header class="text-center mb-5">
        <h1 class="display-4">Tsinjo</h1>
        <p class="lead">Fonds d'urgence solidaire HEI</p>
    </header>

    <!-- Formulaire de don -->
    <div class="card mb-5 shadow">
        <div class="card-body">
            <h2 class="h4 card-title">Faire un don</h2>
            <form th:action="@{/donate}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Nom complet</label>
                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                </div>
                <div class="col-md-6">
                    <label for="pspPaymentId" class="form-label">Référence de paiement</label>
                    <input type="text" class="form-control" id="pspPaymentId" name="pspPaymentId" required>
                </div>
                <div class="col-md-6">
                    <label for="pspType" class="form-label">Moyen de paiement</label>
                    <select class="form-select" id="pspType" name="pspType" required>
                        <option value="ORANGE_MONEY">Orange Money</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Donner !</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Historique -->
    <div class="donation-list">
        <h2 class="h4 mb-4">Historique</h2>
        <div class="list-group">
            <!-- Dons -->
            <div th:each="donation : ${donations}" class="list-group-item">
                <span th:classappend="${donation.payment.verificationStatus == T(com.example.tsinjo.VerificationStatus).SUCCEEDED ? 'positive' :
                                     ${donation.payment.verificationStatus == T(com.example.tsinjo.VerificationStatus).VERIFYING ? 'verifying' : 'negative'}">
                    + <span th:text="${donation.payment.amount} + 'Ar'"></span>
                    <span th:if="${donation.payment.verificationStatus == T(com.example.tsinjo.VerificationStatus).VERIFYING}">
                        (en vérification, <span th:text="${donation.payment.pspType}"></span>)
                    </span>
                    <span th:if="${donation.payment.verificationStatus == T(com.example.tsinjo.VerificationStatus).SUCCEEDED}">
                        (confirmé, <span th:text="${donation.payment.pspType}"></span>)
                    </span>
                </span>
                <div class="text-muted small">
                    <span th:text="${#temporals.format(donation.createdAt, 'dd/MM/yyyy')}"></span>.
                    Par <span th:text="${donation.donorFullName} + ' (' + ${donation.donorEmail} + ')'"></span>
                </div>
            </div>

            <!-- Aides -->
            <div th:each="help : ${helps}" class="list-group-item">
                <span class="negative">
                    - <span th:text="${help.payment.amount} + 'Ar'"></span>
                </span>
                <div class="text-muted small">
                    Pour <span th:text="${help.beneficiaryFullName} + ' (' + ${help.beneficiaryEmail} + ')'"></span>.
                    <span th:text="${help.accidentDescription}"></span>
                </div>
                <div class="text-muted small">
                    <span th:text="${#temporals.format(help.createdAt, 'dd/MM/yyyy')}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
